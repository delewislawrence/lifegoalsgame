<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <title>THE ANIMUS</title>
    <script>
      try {
        var stored = JSON.parse(localStorage.getItem('animus-settings-v1') || '')
        var theme = stored && stored.theme
        var colors = { animus: '#000000', cyber: '#07090b', zen: '#f7f6f3', ash: '#E9E3E6', ember: '#001524' }
        if (!colors[theme]) theme = 'animus'
        document.documentElement.setAttribute('data-theme', theme)
        var meta = document.querySelector('meta[name="theme-color"]')
        if (meta) meta.setAttribute('content', colors[theme])
      } catch (error) {
        document.documentElement.setAttribute('data-theme', 'animus')
      }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Cinzel:wght@500;700&family=IBM+Plex+Mono:wght@400;500&family=Libre+Baskerville:wght@400;700&family=Outfit:wght@300;400;600&family=Source+Sans+3:wght@300;400;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
